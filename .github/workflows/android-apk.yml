name: Build My Excel APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/android-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Find Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          if [ -f "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "sdkmanager found"
          else
            echo "sdkmanager not found"
            find "$ANDROID_SDK_ROOT" -name sdkmanager -type f 2>/dev/null | head -20
            exit 1
          fi

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Create Android project
        shell: bash
        run: |

          mkdir -p android-project/app/src/main/java/com/example/myexcel
          mkdir -p android-project/app/src/main/res/values
          mkdir -p android-project/app/src/main/assets

          cat > android-project/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "MyExcel"
          include(":app")
          EOF

          cat > android-project/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF

          cat > android-project/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > android-project/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.example.myexcel'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.example.myexcel'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.7.0'
          }
          EOF

          cat > android-project/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="true"
                  android:label="My Excel"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > android-project/app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">My Excel</string>
          </resources>
          EOF

          cat > android-project/app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme"
                  parent="Theme.AppCompat.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#1976D2</item>
                  <item name="android:statusBarColor">#1976D2</item>
                  <item name="android:navigationBarColor">#FFFFFF</item>
              </style>
          </resources>
          EOF

          cat > android-project/app/src/main/java/com/example/myexcel/MainActivity.java <<'EOF'
          package com.example.myexcel;

          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          import androidx.appcompat.app.AppCompatActivity;

          public class MainActivity extends AppCompatActivity {

              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setAllowFileAccess(true);

                  webView.setWebViewClient(new WebViewClient());

                  webView.loadUrl("file:///android_asset/index.html");
              }

              @Override
              public void onBackPressed() {
                  if (webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

          cat > android-project/app/src/main/assets/index.html <<'EOF'
          <!DOCTYPE html>
          <html>
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>My Excel</title>

          <style>
          *{box-sizing:border-box}
          body{margin:0;font-family:Arial;background:#f2f4f7}
          .top{background:#1976d2;color:white;padding:12px;font-size:20px;font-weight:bold}
          .toolbar{background:white;padding:8px;display:flex;gap:6px;flex-wrap:wrap}
          button{background:#1976d2;color:white;border:0;border-radius:5px;padding:8px 12px}
          .formula{background:white;padding:7px}
          .formula input{width:100%;padding:8px;font-size:15px}
          .sheet{overflow:auto;height:calc(100vh - 130px)}
          table{border-collapse:collapse;background:white}
          th,td{border:1px solid #bbb;min-width:100px;height:36px}
          th{background:#e3f2fd;text-align:center}
          .rowhead{min-width:45px;width:45px;position:sticky;left:0;background:#e3f2fd}
          td{padding:5px;outline:none}
          td:focus{background:#fffde7;box-shadow:inset 0 0 0 2px #1976d2}
          .status{padding:6px;background:#fafafa;font-size:12px}
          </style>
          </head>

          <body>

          <div class="top">📊 My Excel</div>

          <div class="toolbar">
          <button onclick="saveFile()">Save</button>
          <button onclick="openFile()">Open</button>
          <button onclick="exportCSV()">CSV</button>
          <button onclick="sumSelected()">SUM</button>
          <button onclick="averageSelected()">AVERAGE</button>
          <button onclick="clearSheet()">Clear</button>
          </div>

          <div class="formula">
          <input id="formulaBar"
          placeholder="Cell value / formula যেমন =SUM(A1:A5)">
          </div>

          <div class="sheet">
          <table id="sheet"></table>
          </div>

          <div class="status" id="status">Ready</div>

          <script>

          const ROWS=40;
          const COLS=15;
          let selectedCell=null;

          function colName(n){
              let s="";
              while(n>0){
                  let r=(n-1)%26;
                  s=String.fromCharCode(65+r)+s;
                  n=Math.floor((n-1)/26);
              }
              return s;
          }

          function createSheet(){

              const table=document.getElementById("sheet");
              table.innerHTML="";

              let header=document.createElement("tr");

              let corner=document.createElement("th");
              corner.className="rowhead";
              header.appendChild(corner);

              for(let c=1;c<=COLS;c++){
                  let th=document.createElement("th");
                  th.innerText=colName(c);
                  header.appendChild(th);
              }

              table.appendChild(header);

              for(let r=1;r<=ROWS;r++){

                  let tr=document.createElement("tr");

                  let rh=document.createElement("th");
                  rh.className="rowhead";
                  rh.innerText=r;
                  tr.appendChild(rh);

                  for(let c=1;c<=COLS;c++){

                      let td=document.createElement("td");

                      td.contentEditable=true;
                      td.dataset.row=r;
                      td.dataset.col=c;
                      td.dataset.cell=colName(c)+r;

                      td.addEventListener("focus",function(){
                          selectedCell=this;
                          document.getElementById("formulaBar").value=this.innerText;
                      });

                      td.addEventListener("input",function(){
                          document.getElementById("formulaBar").value=this.innerText;
                      });

                      tr.appendChild(td);
                  }

                  table.appendChild(tr);
              }
          }

          document.getElementById("formulaBar")
          .addEventListener("change",function(){

              if(selectedCell){
                  selectedCell.innerText=this.value;
              }

          });

          function getData(){

              let data=[];

              for(let r=1;r<=ROWS;r++){

                  let row=[];

                  for(let c=1;c<=COLS;c++){

                      let el=document.querySelector(
                      `td[data-row="${r}"][data-col="${c}"]`);

                      row.push(el?el.innerText:"");
                  }

                  data.push(row);
              }

              return data;
          }

          function saveFile(){

              localStorage.setItem(
                  "myExcelData",
                  JSON.stringify(getData())
              );

              document.getElementById("status").innerText=
                  "Saved successfully";
          }

          function openFile(){

              let raw=localStorage.getItem("myExcelData");

              if(!raw){
                  document.getElementById("status").innerText=
                      "No saved data";
                  return;
              }

              let data=JSON.parse(raw);

              for(let r=1;r<=ROWS;r++){
                  for(let c=1;c<=COLS;c++){

                      let el=document.querySelector(
                      `td[data-row="${r}"][data-col="${c}"]`);

                      if(el) el.innerText=data[r-1][c-1]||"";
                  }
              }

              document.getElementById("status").innerText=
                  "Opened successfully";
          }

          function exportCSV(){

              let data=getData();

              let csv=data.map(row=>
                  row.map(v=>'"'+v.replace(/"/g,'""')+'"').join(",")
              ).join("\n");

              let blob=new Blob([csv],{type:"text/csv"});
              let url=URL.createObjectURL(blob);

              let a=document.createElement("a");
              a.href=url;
              a.download="my-excel.csv";
              a.click();

              URL.revokeObjectURL(url);
          }

         
