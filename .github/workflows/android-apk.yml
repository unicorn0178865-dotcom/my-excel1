name: Build My Excel APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/android-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        shell: bash
        run: |
          SDK="$RUNNER_TEMP/android-sdk"
          mkdir -p "$SDK/cmdline-tools"

          cd "$RUNNER_TEMP"
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip

          unzip -q cmdline-tools.zip -d "$SDK/cmdline-tools"
          mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

          "$SDK/cmdline-tools/latest/bin/sdkmanager" --version

      - name: Install Android packages
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Create Android project
        shell: bash
        run: |
          mkdir -p android-project/app/src/main/java/com/example/myexcel
          mkdir -p android-project/app/src/main/res/values
          mkdir -p android-project/app/src/main/assets

          cat > android-project/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "MyExcel"
          include(":app")
          EOF

          cat > android-project/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF

          cat > android-project/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          cat > android-project/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.example.myexcel'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.example.myexcel'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

          cat > android-project/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:theme="@style/AppTheme"
                  android:label="My Excel"
                  android:allowBackup="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > android-project/app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme"
                  parent="@android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#1976D2</item>
                  <item name="android:statusBarColor">#1976D2</item>
              </style>
          </resources>
          EOF

          cat > android-project/app/src/main/java/com/example/myexcel/MainActivity.java <<'EOF'
          package com.example.myexcel;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {

              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setAllowFileAccess(true);

                  webView.setWebViewClient(new WebViewClient());
                  webView.loadUrl("file:///android_asset/index.html");
              }

              @Override
              public void onBackPressed() {
                  if (webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

          cat > android-project/app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">My Excel</string>
          </resources>
          EOF

          cat > android-project/app/src/main/assets/index.html <<'EOF'
          <!DOCTYPE html>
          <html>
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>My Excel</title>

          <style>
          *{box-sizing:border-box}
          body{margin:0;font-family:Arial;background:#f2f4f7}
          .top{background:#1976d2;color:white;padding:12px;font-size:20px;font-weight:bold}
          .toolbar{background:white;padding:8px;display:flex;gap:6px;flex-wrap:wrap}
          button{background:#1976d2;color:white;border:0;border-radius:5px;padding:8px 12px}
          .formula{background:white;padding:7px}
          .formula input{width:100%;padding:8px;font-size:15px}
          .sheet{overflow:auto;height:calc(100vh - 130px)}
          table{border-collapse:collapse;background:white}
          th,td{border:1px solid #bbb;min-width:100px;height:36px}
          th{background:#e3f2fd;text-align:center}
          .rowhead{min-width:45px;width:45px;position:sticky;left:0;background:#e3f2fd}
          td{padding:5px;outline:none}
          td:focus{background:#fffde7;box-shadow:inset 0 0 0 2px #1976d2}
          .status{padding:6px;background:#fafafa;font-size:12px}
          </style>
          </head>

          <body>

          <div class="top">📊 My Excel</div>

          <div class="toolbar">
          <button onclick="saveFile()">Save</button>
          <button onclick="openFile()">Open</button>
          <button onclick="exportCSV()">CSV</button>
          <button onclick="sumSelected()">SUM</button>
          <button onclick="averageSelected()">AVERAGE</button>
          <button onclick="clearSheet()">Clear</button>
          </div>

          <div class="formula">
          <input id="formulaBar"
          placeholder="Cell value / formula যেমন =SUM(A1:A5)">
          </div>

          <div class="sheet">
          <table id="sheet"></table>
          </div>

          <div class="status" id="status">Ready</div>

          <script>

          const ROWS=40;
          const COLS=15;
          let selectedCell=null;

          function colName(n){
              let s="";
              while(n>0){
                  let r=(n-1)%26;
                  s=String.fromCharCode(65+r)+s;
                  n=Math.floor((n-1)/26);
              }
              return s;
          }

          function createSheet(){

              const table=document.getElementById("sheet");
              table.innerHTML="";

              let header=document.createElement("tr");

              let corner=document.createElement("th");
              corner.className="rowhead";
              header.appendChild(corner);

              for(let c=1;c<=COLS;c++){
                  let th=document.createElement("th");
                  th.innerText=colName(c);
                  header.appendChild(th);
              }

              table.appendChild(header);

              for(let r=1;r<=ROWS;r++){

                  let tr=document.createElement("tr");

                  let rh=document.createElement("th");
                  rh.className="rowhead";
                  rh.innerText=r;
                  tr.appendChild(rh);

                  for(let c=1;c<=COLS;c++){

                      let td=document.createElement("td");

                      td.contentEditable=true;
                      td.dataset.row=r;
                      td.dataset.col=c;
                      td.dataset.cell=colName(c)+r;

                      td.addEventListener("focus",function(){
                          selectedCell=this;
                          document.getElementById("formulaBar").value=this.innerText;
                      });

                      td.addEventListener("input",function(){
                          document.getElementById("formulaBar").value=this.innerText;
                      });

                      tr.appendChild(td);
                  }

                  table.appendChild(tr);
              }
          }

          document.getElementById("formulaBar")
          .addEventListener("change",function(){

              if(selectedCell){
                  selectedCell.innerText=this.value;
              }

          });

          function getData(){

              let data=[];

              for(let r=1;r<=ROWS;r++){

                  let row=[];

                  for(let c=1;c<=COLS;c++){

                      let el=document.querySelector(
                      `td[data-row="${r}"][data-col="${c}"]`);

                      row.push(el?el.innerText:"");
                  }

                  data.push(row);
              }

              return data;
          }

          function saveFile(){

              localStorage.setItem(
                  "myExcelData",
                  JSON.stringify(getData())
              );

              document.getElementById("status").innerText=
                  "Saved successfully";
          }

          function openFile(){

              let raw=localStorage.getItem("myExcelData");

              if(!raw){
                  document.getElementById("status").innerText=
                      "No saved data";
                  return;
              }

              let data=JSON.parse(raw);

              for(let r=1;r<=ROWS;r++){
                  for(let c=1;c<=COLS;c++){

                      let el=document.querySelector(
                      `td[data-row="${r}"][data-col="${c}"]`);

                      if(el) el.innerText=data[r-1][c-1]||"";
                  }
              }

              document.getElementById("status").innerText=
                  "Opened successfully";
          }

          function exportCSV(){

              let data=getData();

              let csv=data.map(row=>
                  row.map(v=>'"'+v.replace(/"/g,'""')+'"').join(",")
              ).join("\n");

              let blob=new Blob([csv],{type:"text/csv"});
              let url=URL.createObjectURL(blob);

              let a=document.createElement("a");
              a.href=url;
              a.download="my-excel.csv";
              a.click();

              URL.revokeObjectURL(url);
          }

          function clearSheet(){

              if(!confirm("সব ডাটা মুছে ফেলবেন?")) return;

              document.querySelectorAll("td[contenteditable=true]")
              .forEach(td=>td.innerText="");

              localStorage.removeItem("myExcelData");

              document.getElementById("status").innerText=
                  "Sheet cleared";
          }

          function columnNumber(name){

              let n=0;

              for(let i=0;i<name.length;i++){
                  n=n*26+name.charCodeAt(i)-64;
              }

              return n;
          }

          function cellValue(cell){

              let el=document.querySelector(
                  `td[data-cell="${cell}"]`);

              if(!el)return 0;

              let v=el.innerText.trim();

              if(v.startsWith("="))
                  return evaluateFormula(v);

              let n=parseFloat(v);

              return isNaN(n)?0:n;
          }

          function evaluateFormula(f){

              f=f.toUpperCase().trim();

              let m=f.match(
              /^=(SUM|AVERAGE)\(([A-Z]+)([0-9]+):([A-Z]+)([0-9]+)\)$/);

              if(!m)return 0;

              let fn=m[1];
              let c1=columnNumber(m[2]);
              let r1=parseInt(m[3]);
              let c2=columnNumber(m[4]);
              let r2=parseInt(m[5]);

              let values=[];

              for(let r=r1;r<=r2;r++){
                  for(let c=c1;c<=c2;c++){
                      values.push(cellValue(colName(c)+r));
                  }
              }

              let total=values.reduce((a,b)=>a+b,0);

              if(fn==="SUM")return total;

              return values.length?total/values.length:0;
          }

          function sumSelected(){

              if(!selectedCell)return;

              let c=parseInt(selectedCell.dataset.col);
              let r=parseInt(selectedCell.dataset.row);

              selectedCell.innerText=
                  "=SUM("+colName(c)+"1:"+colName(c)+r+")";

              document.getElementById("status").innerText=
                  "Result: "+evaluateFormula(selectedCell.innerText);
          }

          function averageSelected(){

              if(!selectedCell)return;

              let c=parseInt(selectedCell.dataset.col);
              let r=parseInt(selectedCell.dataset.row);

              selectedCell.innerText=
                  "=AVERAGE("+colName(c)+"1:"+colName(c)+r+")";

              document.getElementById("status").innerText=
                  "Average: "+evaluateFormula(selectedCell.innerText);
          }

          createSheet();

          </script>

          </body>
          </html>
          EOF

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build APK
        working-directory: android-project
        run: |
          gradle assembleDebug --no-daemon
          ls -lh app/build/outputs/apk/debug/

      - name: Verify APK
        shell: bash
        run: |
          test -f android-project/app/build/outputs/apk/debug/app-debug.apk
          echo "APK found:"
          ls -lh android-project/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyExcel-debug-apk
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
